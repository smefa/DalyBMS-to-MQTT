; DALY BMS -> ESP8266 -> Home Assistant (MQTT over WebSocket)
;
; The DALY frame parser lives in lib/daly/ and deliberately has no Arduino
; dependency, so it builds and unit-tests on the host via `pio test -e native`.

[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

; UART0 is wired to the BMS, so there is no USB serial monitor to speak of.
; All diagnostics go to http://dalybms.local/log instead.
upload_speed = 460800

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    ; links2004/WebSockets is vendored in lib/WebSockets with a TLS buffer patch.

build_flags =
    -D ATOMIC_FS_UPDATE
    ; TLS receive buffer in bytes (core default 16384); see lib/WebSockets/PATCH.md.
    -D WEBSOCKETS_SSL_RX_BUFFER=2048
    ; Stack dump at the boot after a hardware WDT, kept for /crash by src/crashlog.cpp.
    ; Moves the 4 kB user stack into the heap, so the sys stack survives the reset.
    -D DEBUG_ESP_HWDT_NOEXTRA4K

; After the first USB flash, switch to OTA so the BMS never needs unplugging.
; Uncomment and set the address, or run:
;   pio run -t upload --upload-port dalybms.lan
; upload_protocol = espota
; upload_port = dalybms.lan

; Bench tool for finding the BMS UART pinout; not the production firmware.
; Uses SoftwareSerial on D5/D6, so USB serial stays free. See tools/uarttest/.
[env:uarttest]
platform = espressif8266
board = d1_mini
framework = arduino
upload_speed = 460800
monitor_speed = 115200
build_src_filter = -<*> +<../tools/uarttest/>
build_flags = -I src

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
